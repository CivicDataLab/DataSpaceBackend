# Full test suite against dev for every PR into main. Required by branch
# protection on main, so a PR merges (and prod deploys) only once it's green.
# Releases come from dev, so the suite checks that dev is running dev's head:
# not the PR head, which is a different commit whenever a release is built as
# a merge to resolve conflicts.
name: PR Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Unit tests for this repo's own code, alongside the browser/API suite.
  django-tests:
    name: Django Tests
    uses: ./.github/workflows/django-tests.yml

  dev-head:
    name: Resolve dev head
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.dev.outputs.sha }}
    steps:
      - id: dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api repos/${{ github.repository }}/commits/dev --jq .sha)" >> "$GITHUB_OUTPUT"

  full-suite:
    name: Full Suite (dev)
    needs: dev-head
    uses: CivicDataLab/CivicDataSpace-test/.github/workflows/run-smoke.yml@CI
    with:
      suite: full
      api_base_url: ${{ vars.DEV_API_BASE_URL }}
      deployed_sha: ${{ needs.dev-head.outputs.sha }}
    secrets:
      HOME_URL_DEV: ${{ secrets.HOME_URL_DEV }}
      TEST_EMAIL_1: ${{ secrets.TEST_EMAIL_1 }}
      TEST_PASSWORD_1: ${{ secrets.TEST_PASSWORD_1 }}
      TEST_EMAIL_2: ${{ secrets.TEST_EMAIL_2 }}
      TEST_PASSWORD_2: ${{ secrets.TEST_PASSWORD_2 }}
      KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
