name: Deploy Backend to Dev EC2

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      force_smoke_failure:
        description: "Deliberately fail the smoke gate to prove rollback works"
        type: boolean
        default: false

concurrency:
  group: dataspace-backend-dev-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'DataSpaceBackend' }}

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin image by digest
        id: push
        run: |
          echo "image_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Sanity check the built image
        run: |
          docker run --rm \
            -e SECRET_KEY=build-check \
            -e URL_WHITELIST=http://localhost \
            -e DB_ENGINE=django.db.backends.sqlite3 \
            --entrypoint python \
            "${{ steps.push.outputs.image_ref }}" \
            manage.py check

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 15
    outputs:
      previous_image: ${{ steps.deploy.outputs.previous_image }}

    steps:
      - name: Deploy over SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATASPACE_IMAGE: ${{ needs.build.outputs.image_ref }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          envs: DATASPACE_IMAGE,GHCR_TOKEN,GHCR_ACTOR
          command_timeout: 12m
          script: |
            set -euo pipefail
            cd "$HOME/${{ env.DEPLOY_PATH }}"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' DataSpace 2>/dev/null || echo "")
            echo "Currently running: ${PREVIOUS_IMAGE:-<none>}"
            mkdir -p .deploy
            echo "$PREVIOUS_IMAGE" > .deploy/previous_image
            echo "previous_image=$PREVIOUS_IMAGE" >> "$GITHUB_OUTPUT"

            docker compose pull backend

            echo "Running migrations..."
            docker compose --profile release run --rm release

            docker compose up -d --no-deps backend

            echo "Waiting for health..."
            for i in $(seq 1 20); do
              if curl -sf http://localhost:8000/health/ > /dev/null; then
                echo "Healthy."
                exit 0
              fi
              sleep 6
            done

            echo "::error::backend did not become healthy after deploy -- rolling back in-place"
            if [ -n "$PREVIOUS_IMAGE" ]; then
              DATASPACE_IMAGE="$PREVIOUS_IMAGE" docker compose up -d --no-deps backend
            fi
            exit 1

  smoke-tests:
    name: Smoke Tests
    needs: deploy
    uses: CivicDataLab/CivicDataSpace-test/.github/workflows/run-smoke.yml@CI
    with:
      api_base_url: ${{ vars.DEV_API_BASE_URL }}
      deployed_sha: ${{ (inputs.force_smoke_failure == true && 'forced-failure-sentinel') || github.sha }}
      min_passed: 1
    secrets:
      HOME_URL_DEV: ${{ secrets.HOME_URL_DEV }}
      TEST_EMAIL_1: ${{ secrets.TEST_EMAIL_1 }}
      TEST_PASSWORD_1: ${{ secrets.TEST_PASSWORD_1 }}
      TEST_EMAIL_2: ${{ secrets.TEST_EMAIL_2 }}
      TEST_PASSWORD_2: ${{ secrets.TEST_PASSWORD_2 }}

  rollback-on-smoke-failure:
    name: Rollback on Smoke Failure
    runs-on: ubuntu-latest
    environment: development
    needs: [deploy, smoke-tests]
    if: failure() && needs.deploy.result == 'success'
    timeout-minutes: 10

    steps:
      - name: Restore previous image over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PREVIOUS_IMAGE: ${{ needs.deploy.outputs.previous_image }}
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          envs: PREVIOUS_IMAGE
          script: |
            set -euo pipefail
            cd "$HOME/${{ env.DEPLOY_PATH }}"

            if [ -z "${PREVIOUS_IMAGE:-}" ]; then
              echo "::error::No previous image was captured -- nothing to roll back to. This is expected on the very first deploy."
              exit 1
            fi

            echo "Rolling back to: $PREVIOUS_IMAGE"
            DATASPACE_IMAGE="$PREVIOUS_IMAGE" docker compose up -d --no-deps backend

            for i in $(seq 1 20); do
              if curl -sf http://localhost:8000/health/ > /dev/null; then
                echo "Rollback healthy."
                exit 0
              fi
              sleep 6
            done
            echo "::error::Rollback image also failed to become healthy -- needs manual intervention."
            exit 1

      - name: Mark this run as failed despite successful rollback
        run: |
          echo "::error::Smoke tests failed after deploy. Rolled back to the previous image -- migrations applied by this deploy were NOT reverted."
          exit 1
