name: Deploy to Amazon ECS

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_EXECUTION_ROLE_ARN: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}
  APP_NAME: dataspace
  APP_PORT: 8000
  DB_ENGINE: django.db.backends.postgresql
  DB_PORT: 5432
  DEBUG_MODE: "False"
  TELEMETRY_URL: http://otel-collector:4317
  CPU_UNITS: 256
  MEMORY_UNITS: 512
  SSM_PATH_PREFIX: /dataspace
  ENVIRONMENT: ${{ secrets.ENVIRONMENT || 'dev' }}

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file aws/cloudformation/dataspace-infrastructure.yml \
            --stack-name dataspace-${{ env.ENVIRONMENT }}-infrastructure \
            --parameter-overrides \
              Environment=${{ env.ENVIRONMENT }} \
              VpcId=${{ secrets.VPC_ID }} \
              SubnetIds=${{ secrets.SUBNET_IDS }} \
              DBUsername=${{ secrets.DB_USERNAME }} \
              DBPassword=${{ secrets.DB_PASSWORD }} \
              DBName=${{ secrets.DB_NAME }} \
              ElasticsearchPassword=${{ secrets.ELASTICSEARCH_PASSWORD }} \
              DjangoSecretKey=${{ secrets.DJANGO_SECRET_KEY }} \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

  deploy-app:
    name: Deploy Application
    runs-on: ubuntu-latest
    environment: development
    needs: deploy-infrastructure
    outputs:
      previous_task_def_arn: ${{ steps.previous-task-def.outputs.arn }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition and get EFS ID
        run: |
          aws ecs describe-task-definition --task-definition dataspace --query taskDefinition > aws/current-task-definition.json
          aws ecs describe-task-definition --task-definition dataspace-otel-collector --query taskDefinition > aws/current-otel-task-definition.json
          # Get the EFS ID from CloudFormation export
          EFS_ID=$(aws cloudformation list-exports --query "Exports[?Name=='dataspace-${{ env.ENVIRONMENT }}-MigrationsFileSystemId'].Value" --output text)
          echo "EFS_ID=$EFS_ID" >> $GITHUB_ENV

      - name: Update container image only
        id: task-def-app
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: aws/current-task-definition.json
          container-name: dataspace
          image: ${{ steps.build-image.outputs.image }}

      - name: Capture currently-running task definition (for rollback)
        id: previous-task-def
        run: |
          ARN=$(aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_SERVICE }}" \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "Currently running: $ARN"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Get running service's network configuration
        id: network-config
        run: |
          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_SERVICE }}" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' \
            --output json)
          {
            echo "subnets=$(echo "$NETWORK_CONFIG" | jq -r '.subnets | join(",")')"
            echo "security_groups=$(echo "$NETWORK_CONFIG" | jq -r '.securityGroups | join(",")')"
            echo "assign_public_ip=$(echo "$NETWORK_CONFIG" | jq -r '.assignPublicIp')"
          } >> "$GITHUB_OUTPUT"

      - name: Run migrations, then deploy the ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-app.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          run-task: true
          run-task-container-overrides: '[{"name":"dataspace","command":["python","manage.py","migrate","--noinput"]}]'
          run-task-subnets: ${{ steps.network-config.outputs.subnets }}
          run-task-security-groups: ${{ steps.network-config.outputs.security_groups }}
          run-task-assign-public-IP: ${{ steps.network-config.outputs.assign_public_ip }}
          wait-for-task-stopped: true

  smoke-tests:
    name: Smoke Tests
    needs: deploy-app
    uses: CivicDataLab/CivicDataSpace-test/.github/workflows/run-smoke.yml@CI
    with:
      api_base_url: ${{ vars.DEV_API_BASE_URL }}
      deployed_sha: ${{ github.sha }}
      min_passed: 1
    secrets:
      HOME_URL_DEV: ${{ secrets.HOME_URL_DEV }}
      TEST_EMAIL_1: ${{ secrets.TEST_EMAIL_1 }}
      TEST_PASSWORD_1: ${{ secrets.TEST_PASSWORD_1 }}
      TEST_EMAIL_2: ${{ secrets.TEST_EMAIL_2 }}
      TEST_PASSWORD_2: ${{ secrets.TEST_PASSWORD_2 }}

  rollback-on-smoke-failure:
    name: Rollback on Smoke Failure
    runs-on: ubuntu-latest
    environment: development
    needs: [deploy-app, smoke-tests]
    if: failure() && needs.deploy-app.result == 'success'
    timeout-minutes: 15

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Restore the previously-running task definition
        run: |
          PREVIOUS_ARN="${{ needs.deploy-app.outputs.previous_task_def_arn }}"
          if [ -z "$PREVIOUS_ARN" ]; then
            echo "::error::No previous task definition was captured -- nothing to roll back to. This is expected on a service's very first deploy."
            exit 1
          fi
          echo "Rolling back to: $PREVIOUS_ARN"
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_SERVICE }}" \
            --task-definition "$PREVIOUS_ARN" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_SERVICE }}"

      - name: Mark this run as failed despite successful rollback
        run: |
          echo "::error::Smoke tests failed after deploy. Rolled back to the previous task definition -- migrations applied by this deploy were NOT reverted. Check what ran via the 'Run migrations, then deploy' step's logs before re-deploying."
          exit 1

  deploy-otel:
    name: Deploy OpenTelemetry Collector
    runs-on: ubuntu-latest
    environment: development
    needs: deploy-app

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current OpenTelemetry task definition
        id: download-otel-taskdef
        run: |
          aws ecs describe-task-definition \
            --task-definition dataspace-otel-collector \
            --query taskDefinition > aws/current-otel-task-definition.json
          cat aws/current-otel-task-definition.json

      - name: Deploy OpenTelemetry ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: aws/current-otel-task-definition.json
          service: ${{ secrets.ECS_OTEL_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
